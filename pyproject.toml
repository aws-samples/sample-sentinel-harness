[project]
name = "sentinel-harness"
# Single source of truth for the version. sentinel_harness.__version__ reads this
# at runtime via importlib.metadata; keep the __init__.py fallback literal in sync.
version = "0.5.1"
description = "Production SecOps agents as configuration on Amazon Bedrock AgentCore Harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT-0" }
dependencies = ["boto3>=1.40.0", "botocore>=1.43.0", "pyyaml>=6.0"]

# Test/dev extras — the offline suite needs pytest + hypothesis (property tests)
# and coverage; pytest-randomly surfaces cross-file import-order coupling. Install
# with `pip install -e '.[test]'` (mirrors the Makefile/CI invocation).
[project.optional-dependencies]
# `tomli` is the 3.10-only TOML reader (stdlib `tomllib` arrives in 3.11). Without it the
# packaging tripwire — which reads pyproject.toml as data — silently SKIPPED its whole
# file on 3.10, the project's own declared minimum, taking the INV-MCP-2 wheel guard with
# it. Marker-gated so 3.11+ does not install a redundant dependency.
test = ["pytest>=8.0", "hypothesis>=6.0", "pytest-randomly>=3.15", "coverage>=7.0", "mcp>=1.0,<3", "anyio[trio]>=4.0", "pytest-anyio>=0.0.0", "tomli>=2.0; python_version<'3.11'"]
# UPPER BOUND REQUIRED — `mcp>=1.0` was an unbounded range, and mcp 2.0.0 is a breaking
# rewrite of the low-level server API this package is built on. `Server.list_tools()` and
# `Server.call_tool()` — the two decorators `sentinel_harness/mcp_server.py` registers its
# handlers with — DO NOT EXIST on 2.0's `Server`:
#
#   mcp 1.28.1   Server(...).list_tools  -> present
#   mcp 2.0.0    Server(...).list_tools  -> AttributeError
#
# Verified against a real 2.0.0 install: `create_server()` raises
# `AttributeError: 'Server' object has no attribute 'list_tools'`, so
# `pip install sentinel-harness[mcp] && sentinel mcp serve` could not start AT ALL. That is
# an install-time, user-facing break on the current PyPI release, not a test artifact.
#
# Note what hid it: CI never installed `mcp` (it hand-copied a partial dep list instead of
# the `test` extra — see INV-CI-1), so every test that would have caught this SKIPPED. The
# silent skip was not concealing a stale test; it was concealing a broken published
# dependency contract.
#
# Also note the check that was NOT sufficient: `from mcp.server import Server` still
# succeeds on 2.0.0, and I first read that as "production is compatible". An import
# resolving proves a module attribute exists, not that the API it exposes has the same
# shape. Compatibility has to be probed by CALLING the surface.
#
# To lift this bound, port mcp_server.py to 2.0's request-handler API
# (`add_request_handler` / middleware) and re-verify with:
#   uv run --with 'mcp>=2.0' python -c \
#     "from sentinel_harness.mcp_server import create_server; create_server()"
# `tests/test_mcp_version_bound.py` fails if this bound is removed while the code still
# depends on the 1.x decorators.
mcp = ["mcp>=1.0,<3"]

[project.scripts]
sentinel = "sentinel_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Packaging: an explicit two-name list silently DROPPED sentinel_harness.connectors
# (subpackages are not implied) and the whole tools/ tree — pip-installed users got
# `tool handler not found` from `sentinel detection audit` / `sentinel mcp serve`.
# find() with namespaces=true ships sentinel_harness + all subpackages, intake, and
# the flat tools/<name>/handler.py tree (namespace packages — no __init__.py needed).
#
# `harnesses*` was added after the same failure mode was measured a THIRD time. The wheel
# omitted `harnesses/`, so on an installed wheel the documented no-lock-in escape hatch —
# `sentinel export alert-triage`, taught in README.md and docs/QUICKSTART.md — could not
# resolve any of the 8 shipped harnesses, and said so while pointing at a site-packages path
# that did not exist. INV-MCP-2 fixed exactly this for `registry/`; `harnesses/` was left out.
# "A fix applied to one call site is not an invariant" — this time the call site was a
# packaging include list. `test_wheel_contents.py` now asserts every harness reaches the wheel.
[tool.setuptools.packages.find]
include = ["sentinel_harness*", "intake*", "tools*", "mockdata*", "harnesses*"]
namespaces = true

# Data files, NOT code. Round 20: `registry/tools.yaml` is the governance decision
# (which tools are approved) and it was not in the wheel at all, so a pip-installed
# `sentinel-mcp` could not read it — and mcp_server treated the unreadable registry as
# "no filtering", exposing every pending tool. A dropped data file fails SILENTLY and
# permissively, unlike the dropped `connectors` subpackage above, which failed loudly.
[tool.setuptools.package-data]
sentinel_harness = ["data/*.yaml"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# The library and scenarios deliberately use a compact one-statement-per-line
# style (`if x: y`, grouped imports) for readability of declarative config.
# Ignore those stylistic codes so CI lint flags real problems, not house style.
#   E401  multiple imports on one line
#   E701  multiple statements on one line (colon)
#   E702  multiple statements on one line (semicolon)
#   E402  module import not at top of file (scenarios/tests do sys.path insert first)
ignore = ["E401", "E701", "E702", "E402"]
