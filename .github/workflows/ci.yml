name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref makes the previous run's verdict obsolete, so cancel it and
  # stop paying for a result nobody will read. Keyed by workflow+ref so main and each PR
  # queue independently.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python ${{ matrix.python-version }}
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable) + test deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install the package WITH ITS `test` EXTRA, not a hand-copied dep list.
          #
          # This used to read `pip install -e .` followed by
          #   pip install pytest pytest-randomly coverage ruff==... hypothesis
          # — five of the `test` extra's nine entries. The two it omitted were `mcp` and
          # `anyio[trio]`, so `tests/test_mcp_protocol.py`'s module-level
          # `importorskip("mcp")` fired on every CI run and the ENTIRE MCP protocol E2E
          # layer silently skipped. Local runs showed 6 skips, CI showed 12, and nothing
          # compared the two numbers. Those tests exercise the one surface an untrusted MCP
          # peer reaches — the layer most worth running in CI was the layer never running
          # in CI, and it reported green the whole time. Skip is not pass.
          #
          # A hand-copied dependency list is a second source of truth that nothing
          # reconciles; `[test]` cannot drift from pyproject.toml because it IS
          # pyproject.toml. `tests/test_ci_installs_the_test_extra.py` now asserts this.
          # ruff stays separate and PINNED (not in the extra) so the lint verdict is
          # byte-identical between pre-commit, `make ci` and CI.
          pip install -e ".[test]"
          pip install ruff==0.15.20
          # `build` is needed by tests/test_wheel_contents.py (INV-PKG-2), which builds a real
          # wheel and checks its CONTENTS — the only way to catch a stale build/lib/ staging tree
          # shipping a deleted module. Without it those assertions would SKIP, and a packaging
          # guard that skips in CI is the failure mode INV-CI-1 and INV-DOC-5 both record.
          pip install build
          python -c "import build; print('build backend OK')"
          # `uv` is needed by tests/test_installed_cli_e2e.py (INV-PKG-4), which installs the
          # built wheel into an ISOLATED environment (`uv run --no-project --with <wheel>`) and
          # runs the documented CLI there. That isolation is the whole point: it is the only
          # configuration in which "the file is in the wheel but the command does not work" is
          # visible, and it found `sentinel export <name>` broken for all 8 harnesses.
          #
          # The guard REFUSES to skip when CI=1, so the first run of this layer failed the job
          # with "uv is not available but CI=1" — working exactly as intended. The fix is to
          # provide the tool, not to relax the guard: INV-CI-1, INV-DOC-5, INV-PKG-1 and
          # INV-PKG-2 are all records of a check that went quiet instead of failing.
          pip install uv
          uv --version
          # Fail loudly here rather than skipping quietly later: if an optional test
          # dependency did not install, every test that needs it would report "skipped",
          # which is indistinguishable from "there was nothing to run".
          python -c "import mcp, anyio, trio, hypothesis, pytest_randomly, coverage; print('test extra OK')"

      - name: Smoke-test install (import + console script)
        env:
          SENTINEL_EXECUTION_ROLE_ARN: arn:aws:iam::000000000000:role/ci-test-role
        run: |
          python -c "import sentinel_harness; print('version', sentinel_harness.__version__)"
          sentinel --help

      - name: Lint (ruff — REQUIRED, fails the build)
        # Hard gate: any lint error fails CI. No best-effort skip.
        run: ruff check .

      - name: Run tests with coverage (offline, no AWS calls)
        env:
          # Dummy values so boto3 client construction and import are hermetic.
          # The suite makes ZERO AWS calls; these just keep imports from trying to
          # resolve a real region/profile/credentials.
          SENTINEL_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          SENTINEL_EXECUTION_ROLE_ARN: arn:aws:iam::000000000000:role/ci-test-role
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        # pytest-randomly prints the chosen seed on the first line so a failing
        # order can be reproduced with `pytest -p randomly --randomly-seed=<N>`.
        run: coverage run -m pytest -q tests

      - name: Enforce coverage gate (fail under 88%)
        # A fresh full-suite run measures ~90% (stable across pytest-randomly
        # seeds). 88 is a floor set just below the real number — it MUST match
        # .coveragerc's [report] fail_under and `make ci`.
        run: coverage report --fail-under=88

      - name: Verify the documented coverage figures (INV-DOC-5)
        # MUST run AFTER the step above, and as a SEPARATE step. `tests/test_coverage_doc.py`
        # re-measures every figure in `tests/README-coverage.md` against real coverage data —
        # but `coverage run -m pytest tests` only WRITES `.coverage` when it exits, so during
        # the main test step those 3 assertions found no data file and called `pytest.skip`.
        # They therefore NEVER ran in CI: the guard that keeps the coverage doc honest was
        # itself only ever verified on a maintainer's laptop. Measured, not assumed —
        # replicating CI's exact invocation locally reproduced `SKIPPED [3]`.
        #
        # This is INV-CI-1's shape again (a check that silently no-ops where it matters most),
        # so the env var below makes the skip IMPOSSIBLE here: with
        # SENTINEL_REQUIRE_COVERAGE_DATA=1 the helper raises instead of skipping. Otherwise a
        # future change to the data-file path would quietly restore the no-op and this step
        # would still report green.
        #
        # A plain `pytest` run does not touch `.coverage`, so this cannot disturb the gate
        # above (verified: file checksum unchanged).
        env:
          SENTINEL_REQUIRE_COVERAGE_DATA: "1"
          SENTINEL_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          SENTINEL_EXECUTION_ROLE_ARN: arn:aws:iam::000000000000:role/ci-test-role
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: python -m pytest tests/test_coverage_doc.py -q

  mypy:
    name: mypy (strict on security modules, lenient elsewhere)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install package + mypy
        run: |
          python -m pip install --upgrade pip
          # Install the package so its runtime deps (boto3/pyyaml) are importable
          # for follow-imports; mypy itself reads mypy.ini for its lenient config.
          pip install -e .
          pip install mypy

      - name: Type-check core control-plane modules
        # Lenient today (see mypy.ini: ignore-missing-imports, no strict), so this
        # job starts GREEN and can be ratcheted later by tightening mypy.ini.
        # Scope is the stable control-plane surface only.
        run: |
          mypy \
            sentinel_harness/core.py \
            sentinel_harness/factory.py \
            sentinel_harness/loader.py \
            sentinel_harness/registry.py \
            sentinel_harness/registry_live.py

      - name: Type-check SECURITY-CRITICAL modules under --strict
        # WHY a second, STRICTER job: these are the modules that decide whether an
        # agent reaches production and what a sandboxed agent may execute. The M18
        # audit found four defects here — every one of them in a module that the
        # lenient gate above did not even cover. An implicit-Optional or an
        # untyped dict is exactly how "did the judge score safety at all?" became
        # an unasked question (see docs/INVARIANTS.md).
        #
        # --follow-imports=silent keeps the strictness scoped to THESE files: the
        # lenient modules they import are still analysed for types, but their own
        # (not-yet-strict) errors are not reported here. Ratchet by moving a file
        # from the lenient list above into this one.
        run: |
          mypy --strict --ignore-missing-imports --follow-imports=silent \
            sentinel_harness/loop_safety.py \
            sentinel_harness/autonomy.py \
            sentinel_harness/agent_loop.py \
            sentinel_harness/sandbox_hooks.py \
            sentinel_harness/provenance.py \
            sentinel_harness/feedback.py

  iac:
    name: iac (cdk synth + stack tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: iac-cdk
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install CDK app dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Synthesize CloudFormation (cdk synth)
        run: npx cdk synth

      - name: Run self-contained stack synth tests (ts-node)
        # Each test is a standalone ts-node script that exits non-zero on the first
        # failed assertion (see test/*.test.ts headers). No jest is wired in.
        run: |
          for t in test/*.test.ts; do
            echo "=== running $t ==="
            npx ts-node "$t"
          done

  real-stack:
    # The specialist stack (strands-agents[a2a,litellm] + litellm) is declared in NO extra, so
    # ten `importorskip("strands")` / `importorskip("litellm")` calls across five test files
    # skipped in EVERY environment — local and CI alike. One step worse than INV-CI-1, where
    # the dependency at least existed in an extra: here the suite could not install it at all,
    # so those tests could never run anywhere.
    #
    # They were not redundant. Running them for the first time immediately exposed a real
    # defect: a top-level `litellm/` directory in this repo shadowed (and was shadowed BY) the
    # real PyPI `litellm`, so `litellm.gateway` raised ModuleNotFoundError the moment the real
    # package was installed — which every specialist container does. The gateway was broken in
    # the only environment it targets, and the skip is why nobody knew. See INV-PKG-1.
    #
    # A separate job because the stack is ~108 MB on top of the test extra. It runs the five
    # affected files, which take ~3s once installed.
    name: real specialist stack (strands + litellm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.13
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install the package, the test extra, and the REAL specialist stack
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          # Installed FROM the specialist's own requirements.txt rather than from a version
          # re-typed here. This job's purpose is to test the stack that actually ships, and a
          # hand-copied pin cannot guarantee that: it said `==1.9.1` while the containers had
          # moved on, so "the SAME version the containers pin" was a claim, not a fact. Reading
          # the file makes it a fact — the same reason `-e ".[test]"` replaced a hand-copied dep
          # list in this workflow (INV-CI-1). All four specialists pin an identical stack, which
          # tests/test_specialist_containers.py asserts, so any one of them is representative.
          pip install -r specialists/cve-intel/requirements.txt
          # Fail loudly here rather than skipping quietly later — the entire point of this job
          # is that these imports resolve. A silent skip would restore the original defect.
          python -c "import strands, litellm; print('real stack OK')"

      - name: Run the tests that need the real stack (skips are FAILURES here)
        env:
          SENTINEL_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          SENTINEL_EXECUTION_ROLE_ARN: arn:aws:iam::000000000000:role/ci-test-role
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        # `-p no:randomly` for a stable report; `-ra` so any skip is visible in the log.
        run: |
          python -m pytest -q -p no:randomly -ra \
            tests/test_specialist.py \
            tests/test_attack_mapper.py \
            tests/test_threat_hunt.py \
            tests/test_adversarial_reviewer.py \
            tests/test_inference_gateway.py \
            tests/test_exported_agent_runs.py \
            tests/test_no_toplevel_name_shadows_a_dependency.py \
            | tee /tmp/real_stack.log
          # A skip caused by a MISSING DEPENDENCY means this job verified nothing — the condition
          # that hid a production defect for the whole life of these tests. Green must mean
          # "ran", not "declined to run".
          #
          # But not every skip is that. `test_exported_agent_runs.py` skips per-harness cases
          # that are genuinely inapplicable (four of the eight harnesses declare no
          # human-approval tool, so there is no warning to assert). Failing on ANY skip would
          # make those legitimate cases indistinguishable from a broken install — the very
          # conflation this check exists to prevent, pointed the other way.
          #
          # So the check is by REASON, not by count. Counting would also drift: the threshold
          # would need editing every time a harness gains or loses a gate, and a stale threshold
          # silently absorbs real regressions.
          if grep -qiE "SKIPPED.*(could not import|No module named|not installed)" /tmp/real_stack.log; then
            echo "::error::a test SKIPPED for a MISSING DEPENDENCY in the real-stack job — the"\
                 "heavy deps did not resolve, so this job verified nothing. See INV-PKG-1."
            grep -iE "SKIPPED.*(could not import|No module named|not installed)" /tmp/real_stack.log
            exit 1
          fi
          # And the job must actually have RUN something substantial: an empty selection would
          # produce zero skips and pass this check while verifying nothing at all.
          if ! grep -qE "[0-9]{2,} passed" /tmp/real_stack.log; then
            echo "::error::the real-stack job ran fewer than 10 tests — the selection is wrong."
            tail -5 /tmp/real_stack.log
            exit 1
          fi

  secret-and-name-scan:
    name: secret-and-name scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # This repo is PUBLIC open source. It must contain ZERO trace of any
      # customer/company name, and NO hardcoded AWS account IDs or access keys.
      # The scan fails the build if any of those leak in. Patterns are written so
      # this workflow file does not match itself (character classes / no literal
      # forbidden tokens appear as scannable strings).
      - name: Scan for customer names and hardcoded AWS credentials
        run: |
          set -uo pipefail
          # Search everything except the VCS dir. .github is deliberately INCLUDED —
          # workflow files are exactly where a real OIDC role ARN (live account id) or
          # a static access key can leak in a public repo; the patterns are
          # char-class-assembled so the workflows never match themselves.
          GREP() { grep -rInE "$1" . \
            --binary-files=without-match \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.venv \
            --exclude-dir=__pycache__ ; }

          FAILED=0

          # 1) Customer / company names (case-insensitive). Built from a char
          #    class so the literal name never appears in this file.
          NAME_RE='[Aa][Vv][Ee][Nn][Ii][Rr]'
          if GREP "$NAME_RE"; then
            echo "::error::Customer/company name found in repository. This is a public repo — remove it."
            FAILED=1
          fi

          # 2) Hardcoded 12-digit AWS account IDs inside an IAM/ARN/ECR context, e.g.
          #    arn:aws:iam::123456789012:role/...  (global ARN),
          #    arn:aws:bedrock-agentcore:us-east-1:123456789012:...  (REGIONAL ARN),
          #    123456789012.dkr.ecr.us-east-1.amazonaws.com/...  (ECR image URI).
          #    The all-zeros placeholder (000000000000) used in docs/tests, the
          #    canonical AWS documentation example account (123456789012), and the
          #    repeated-digit placeholder (555555555555) used in offline test
          #    fixtures, are allowed (all are well-known non-real placeholders).
          ACCT_RE='(iam|sts|logs|s3|lambda|bedrock-agentcore)::[0-9]{12}:|arn:aws[a-z-]*:[a-z0-9-]*:[a-z0-9-]*:[0-9]{12}:|[0-9]{12}\.dkr\.ecr\.'
          if GREP "$ACCT_RE" | grep -vE ':0{12}:|0{12}\.dkr|123456789012|555555555555'; then
            echo "::error::Hardcoded 12-digit AWS account ID found. Use env vars / the 000000000000 placeholder instead."
            FAILED=1
          fi

          # 3) AWS access key IDs (AKIA / ASIA prefixes + 16 uppercase/digits).
          #    Assembled from a char class so no real-looking key sits in this file.
          KEY_RE='(A[KS]IA)[0-9A-Z]{16}'
          if GREP "$KEY_RE"; then
            echo "::error::Hardcoded AWS access key ID found. Never commit credentials."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "secret-and-name scan FAILED"
            exit 1
          fi
          echo "secret-and-name scan passed — no customer names or hardcoded credentials found."
