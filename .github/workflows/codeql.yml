name: CodeQL

# Static analysis / code scanning for both languages present in this repo:
#   - python                  : the sentinel_harness library, tools, tests
#   - javascript-typescript   : the AWS CDK app under iac-cdk/
#
# Runs on push to main, on every PR, and on a weekly schedule so newly published
# CodeQL queries catch regressions even without a code change. Token-free: uses
# the default GITHUB_TOKEN with the minimal permissions declared below.
#
# This is an *advanced* configuration. Code scanning "default setup" must stay OFF
# for the repo (Settings → Code security → CodeQL analysis → Advanced): GitHub
# rejects SARIF from an advanced config while default setup is enabled, with
# "CodeQL analyses from advanced configurations cannot be processed".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 07:13 UTC (offset from :00 to avoid the cron rush).
    - cron: "13 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Same reasoning as ci.yml. The weekly schedule runs on `main`, so it shares main's group
  # and a push simply supersedes it — which is correct: the newer commit is the one to scan.
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # required to upload CodeQL results to code scanning
      actions: read            # required by CodeQL on private/internal repos; harmless on public
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]

    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        # github/codeql-action/init v4.37.5
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43
        with:
          # `languages` (plural) is the real input name. The singular `language` is
          # silently ignored, which makes the action autodetect EVERY language in the
          # repo — each matrix leg then re-scans all of them instead of just its own.
          languages: ${{ matrix.language }}
          # Both languages here are interpreted: extract straight from source, so no
          # build (and no autobuild step) is needed.
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        # github/codeql-action/analyze v4.37.5
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43
        with:
          category: "/language:${{ matrix.language }}"
