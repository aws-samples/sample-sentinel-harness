# Dependabot configuration for the sentinel-harness supply chain.
#
# Keeps every ecosystem in the repo patched on a weekly cadence:
#   - pip            : Python runtime/test deps declared in pyproject.toml + requirements.txt (repo root)
#   - pip (containers): the DEPLOYED container deps — the four specialist Runtime images and the
#                      bas-runner long-running image, each with its own requirements.txt
#   - npm            : the AWS CDK app under iac-cdk/ (package.json / package-lock.json)
#   - github-actions : the third-party actions used by the workflows in .github/workflows/
#   - docker         : the base images those containers build FROM
#
# The container entries are NOT decorative. Before they existed, Dependabot covered only pip at
# the repo root, and the five container requirements.txt files were updated exclusively BY HAND —
# verifiable in the history: every commit touching them is a human one, and Dependabot's own
# commits only ever touched `.github/workflows/`. `pip-audit` in supply-chain.yml did not close
# the gap either: it resolves its audit set from `pyproject.toml` alone, so the deps that actually
# run in the deployed containers were audited by NOTHING.
#
# Measured at the time these entries were added: `pip-audit -r` on each specialist reported
# **19 known vulnerabilities in 2 packages** — `litellm` (12) and `starlette` (7) — both pulled
# TRANSITIVELY by `strands-agents[a2a,litellm]==1.9.1` and `fastapi==0.139.0`. `bas-runner` was
# clean, which is the negative control proving the audit was discriminating rather than red for
# everything. So the coverage gap had already let vulnerable dependencies ship.
#
# All PRs are grouped where it reduces churn and labelled so they are easy to triage.
# This file is token-free: Dependabot runs with GitHub's built-in permissions.
version: 2

updates:
  # --- Python (repo root) -------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dev:
        patterns:
          - "*"
    # mcp is held below 2, with evidence rather than caution — and Dependabot has already
    # proposed lifting it once (PR #59, "update mcp requirement from <2,>=1.0 to >=1.0,<3"),
    # which is why the bound needs to be stated HERE and not only in pyproject.toml's comment
    # and docs/INVARIANTS.md. Dependabot does not read either of those, so without this `ignore`
    # the same PR arrives every week and the reason has to be re-derived each time.
    #
    # mcp 2.0.0 is a breaking rewrite of the low-level server API this package is built on.
    # Re-verified against the real 2.0.0 release rather than trusted from the record:
    #
    #   mcp 2.0.0   from mcp.server import Server        -> OK  (an import check proves nothing)
    #   mcp 2.0.0   Server("probe").list_tools           -> GONE
    #   mcp 2.0.0   Server("probe").call_tool            -> GONE
    #   mcp 2.0.0   sentinel_harness.mcp_server.create_server()
    #                 -> AttributeError: 'Server' object has no attribute 'list_tools'
    #
    # Those two decorators are how `mcp_server.py` registers every handler, so on 2.x
    # `pip install sentinel-harness[mcp] && sentinel mcp serve` cannot start AT ALL — a
    # user-facing install-time break, not a test artifact (INV-MCP-5).
    #
    # Lifting this bound means PORTING mcp_server.py to 2.0's request-handler API, not bumping a
    # number. Re-verify with:
    #     uv run --with 'mcp>=2.0' python -c \
    #       "from sentinel_harness.mcp_server import create_server; create_server()"
    # `tests/test_mcp_version_bound.py` fails if the bound is removed while the code still needs
    # the 1.x decorators, so this ignore cannot silently outlive its reason.
    ignore:
      - dependency-name: "mcp"
        versions: [">=2.0.0"]

  # --- Python in the DEPLOYED containers ----------------------------------
  # One `pip` entry covering every container requirements.txt via `directories`. These are the
  # deps that actually run in the Runtime images; the root `pip` entry above does not see them.
  #
  # Grouped into ONE PR per run deliberately: `test_specialist_containers.py` asserts all four
  # specialists ship a byte-identical dependency set, so four separate PRs would each break that
  # invariant until the last one merged. A single grouped PR keeps them in step.
  - package-ecosystem: "pip"
    directories:
      - "/specialists/adversarial-reviewer"
      - "/specialists/attack-mapper"
      - "/specialists/cve-intel"
      - "/specialists/threat-hunt"
      - "/longrunning/bas-runner"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "containers"
    commit-message:
      prefix: "chore(deps)"
    groups:
      container-runtime:
        patterns:
          - "*"
    # Same mcp 2.x bound as the root entry, for a DIFFERENT reason — and it has to be repeated
    # because Dependabot `ignore` is per-update-block, not global. PR #60 (the first PR this very
    # entry produced) proposed `mcp==1.28.1 -> mcp==2.0.0` in all four specialists.
    #
    # The root bound is about the SERVER surface (`Server.list_tools` / `.call_tool`, gone in 2.0).
    # The specialists never touch that; they use the CLIENT surface. So this needed its own
    # measurement rather than an assumption that the same bound applies — and it does, because the
    # client surface broke too:
    #
    #   mcp 2.0.0   from mcp import ClientSession                                  -> OK
    #   mcp 2.0.0   from mcp.client.streamable_http import streamablehttp_client   -> ImportError
    #
    # All four `specialists/*/agent_a2a.py` import `streamablehttp_client` to reach the Gateway,
    # so 2.x breaks the A2A specialists as surely as it breaks `sentinel mcp serve` — two
    # independent breakages behind one version number.
    #
    # Lifting this means porting the client calls to 2.0's API in the same change. Re-verify with:
    #     uv run --with 'mcp>=2.0' python -c \
    #       "from mcp.client.streamable_http import streamablehttp_client"
    ignore:
      - dependency-name: "mcp"
        versions: [">=2.0.0"]

  # --- Base images those containers build FROM ----------------------------
  # A pinned base image still goes stale: `python:3.13-slim` gets rebuilt with OS-level CVE fixes,
  # and nothing here was watching it. Grouped for the same reason as above — the specialists are
  # asserted to be at base-image parity.
  - package-ecosystem: "docker"
    directories:
      - "/specialists/adversarial-reviewer"
      - "/specialists/attack-mapper"
      - "/specialists/cve-intel"
      - "/specialists/threat-hunt"
      - "/longrunning/bas-runner"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    groups:
      base-images:
        patterns:
          - "*"

  # --- CDK app (iac-cdk/) -------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/iac-cdk"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cdk:
        patterns:
          - "aws-cdk*"
          - "constructs"
      dev-tooling:
        patterns:
          - "typescript"
          - "ts-node"
          - "@types/*"
    # TypeScript is held below 7, with evidence rather than caution. Both majors were
    # tested and they came out differently:
    #
    #   6.0.3  tsc exit 0 · 8/8 stack tests · cdk synth 9 stacks  -> ADOPTED
    #   7.0.2  tsc exit 0, but ALL 8 stack tests die at startup with
    #          `TypeError: Cannot read properties of undefined (reading 'fileExists')`
    #
    # TS 7 is the native rewrite and no longer exposes the `ts.sys` JS surface that
    # `ts-node` reads its tsconfig through. The bound is at the measured break point, not
    # at "no major upgrades" — 6 was a real upgrade that shipped.
    #
    # `.github/workflows/ci.yml` runs those tests via `npx ts-node` per file (no jest),
    # so adopting TS 7 means the IaC test layer cannot start at all. Lifting this needs a
    # runner migration (tsx, `node --experimental-strip-types`, or jest+swc) as its own
    # change, not a version bump. Re-verify with:
    #     npm install typescript@~7 && npx tsc --noEmit && npx ts-node test/*.test.ts
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # --- GitHub Actions -----------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
