# Dependabot configuration for the sentinel-harness supply chain.
#
# Keeps three ecosystems patched on a weekly cadence:
#   - pip            : Python runtime/test deps declared in pyproject.toml + requirements.txt (repo root)
#   - npm            : the AWS CDK app under iac-cdk/ (package.json / package-lock.json)
#   - github-actions : the third-party actions used by the workflows in .github/workflows/
#
# All PRs are grouped where it reduces churn and labelled so they are easy to triage.
# This file is token-free: Dependabot runs with GitHub's built-in permissions.
version: 2

updates:
  # --- Python (repo root) -------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dev:
        patterns:
          - "*"

  # --- CDK app (iac-cdk/) -------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/iac-cdk"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cdk:
        patterns:
          - "aws-cdk*"
          - "constructs"
      dev-tooling:
        patterns:
          - "typescript"
          - "ts-node"
          - "@types/*"
    # TypeScript is held at 5.x, with evidence rather than caution. Tested empirically:
    # under 7.0.2 `tsc --noEmit` is CLEAN (the 7 x TS2591 "Cannot find name 'process'"
    # errors were only a missing `types: ["node"]`, now declared in tsconfig.json), but
    # ALL 8 stack tests die at startup with `TypeError: Cannot read properties of
    # undefined (reading 'fileExists')` — TS 7 is the native rewrite and no longer
    # exposes the `ts.sys` JS surface that `ts-node` reads its tsconfig through.
    #
    # `.github/workflows/ci.yml` runs those tests via `npx ts-node` per file (no jest),
    # so adopting TS 7 means the IaC test layer cannot start at all. Lifting this needs a
    # runner migration (tsx, `node --experimental-strip-types`, or jest+swc) as its own
    # change, not a version bump. Re-verify with:
    #     npm install typescript@~7 && npx tsc --noEmit && npx ts-node test/*.test.ts
    ignore:
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # --- GitHub Actions -----------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
